name: Nix CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check + build
    runs-on: macos-latest # arm64 (Apple Silicon, aarch64-darwin)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake (syntax + module options)
        run: nix flake check

      - name: Build dms-gop package
        run: nix build .#dms-gop
