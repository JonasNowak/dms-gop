name: Create Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest # arm64 (Apple Silicon, aarch64-darwin)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build Binaries
    needs: [test]
    strategy:
      matrix:
        include:
          # dms-gop targets Apple Silicon macOS only: darwin/arm64.
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go with cache
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Build CLI Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.ref_name }}
          BINARY_NAME="dms-gop-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags "-s -w -X main.Version=${VERSION}" -o "${BINARY_NAME}" ./cmd/dms-gop

          # Package the binary (BSD tar/zip on macOS — no GNU tar --transform)
          tar -czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"
          zip "${BINARY_NAME}.zip" "${BINARY_NAME}"

      - name: Generate checksums
        run: |
          BINARY_NAME="dms-gop-${{ matrix.goos }}-${{ matrix.goarch }}"
          shasum -a 256 "${BINARY_NAME}.tar.gz" > "${BINARY_NAME}.tar.gz.sha256"
          shasum -a 256 "${BINARY_NAME}.zip" > "${BINARY_NAME}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dms-gop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dms-gop-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dms-gop-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
            dms-gop-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            dms-gop-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256

  create_release:
    name: Create GitHub Release
    runs-on: macos-latest # arm64 (Apple Silicon, aarch64-darwin)
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for changelog generation

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # Generate changelog
      - name: Generate Changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --oneline --pretty=format:"- %s (%h)" | head -50)
          else
            echo "Generating changelog from $PREVIOUS_TAG to HEAD"
            CHANGELOG=$(git log --oneline --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          fi

          # Create the changelog with proper formatting
          cat > CHANGELOG.md << EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ github.ref_name }}
          EOF

          # Set output for use in release step
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Create GitHub Release
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            --prerelease="${{ contains(github.ref_name, '-') }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload release assets
      - name: Upload release assets
        run: |
          find ./artifacts -name "dms-gop-*" -type f | while read file; do
            echo "Uploading: $file"
            gh release upload "${{ github.ref_name }}" "$file" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
